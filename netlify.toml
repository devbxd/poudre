[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "@electric-sql/pglite", "postgres"]
  included_files = ["site/templates/**", "db/schema.sql"]

# Dashboard is a single-page app
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/index.html"
  status = 200

[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/wp-includes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# the dashboard's offline service worker must always be fresh so updates reach the tills
[[headers]]
  for = "/dashboard/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/dashboard/"
